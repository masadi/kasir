[alembic]
# Migration scripts location relative to this file
script_location = migrations

# Auto-format any generated revision files with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

# Path prepended to sys.path so `server` (models) can be imported by env.py
prepend_sys_path = .

# Timezone for `create_date` in revisions
timezone = UTC

# sqlalchemy.url is set dynamically in migrations/env.py from DATABASE_URL env var
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
