services:
  postgres:
    image: postgres:16-alpine
    container_name: kasirku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kasirku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kasirku}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasirku} -d ${POSTGRES_DB:-kasirku}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kasirku-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasirku-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-kasirku}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-kasirku}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kasirku-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_URL:-http://localhost:8080}
    container_name: kasirku-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - kasirku-net

volumes:
  pg_data:

networks:
  kasirku-net:
    driver: bridge
