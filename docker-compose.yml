services:
  mongo:
    image: mongo:7
    container_name: kasirku-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - kasirku-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasirku-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      - mongo
    networks:
      - kasirku-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_URL:-http://localhost:8080}
    container_name: kasirku-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - kasirku-net

volumes:
  mongo_data:

networks:
  kasirku-net:
    driver: bridge
